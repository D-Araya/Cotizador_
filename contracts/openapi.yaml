        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Registra un nuevo cliente corporativo
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        '201':
          description: Cliente creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
