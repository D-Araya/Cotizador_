    patch:
      tags: [Customers]
      operationId: updateContact
      summary: Actualiza los datos de un contacto de cliente
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdateRequest'
      responses:
        '200':
          description: Contacto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Customers]
      operationId: deactivateContact
      summary: Baja lógica de un contacto y revocación de su acceso al portal (Exclusivo ADMIN)
      description: |
        **Rol requerido:** Exclusivo `ADMIN` (`bearerAuth`). Marca `deletedAt`, `active: false` y `portalTokenRevoked: true`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Contacto dado de baja y acceso revocado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
