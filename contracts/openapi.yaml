openapi: 3.1.0
info:
  title: Cotizador Online — M&L Ingeniería Naval SpA API
  version: 2.0.0
  description: |
    Especificación **OpenAPI 3.1** (Contract-First & Code-Audited) de la plataforma **Cotizador Online** para **M&L Ingeniería Naval SpA (Chile)**.

    ### Reglas de Negocio y Dominio Financiero
    - **Moneda Nacional (CLP) e IVA (19%):** Todos los montos monetarios en Pesos Chilenos (`CLP`) se procesan y persisten como números enteros sin decimales (`Math.round`), aplicando una tasa impositiva de IVA del **19%** (`taxRatePct: 19`). También se soporta conversión referencial a **UF** (`ufRate`) configurable diariamente por Administración.
    - **Fórmula de Margen sobre Precio de Venta:** `marginPct = ((precio - costo) / precio) * 100`.
    - **Piso Duro y Excepciones de Margen:** Ninguna cotización puede guardarse ni enviarse por debajo del piso duro no negociable (`hardMinMarginPct`, p. ej. 18%). Si el margen cae entre el piso duro y el margen mínimo corporativo (`minMarginPct`, p. ej. 25%–28%), la cotización pasa a estado `PENDING_APPROVAL` requiriendo aprobación explícita de un `ADMIN`.
    - **Operaciones Post-Aceptación:** Al aceptarse una cotización (en línea con firma digital y hash SHA-256 u offline mediante Orden de Compra), se emite automáticamente un **Documento de Cobro** (`Invoice`, `DC-XXXXXX`) con cronograma de hitos (`PENDING`, `PARTIAL`, `PAID`, `OVERDUE`) y se habilitan **Órdenes de Trabajo Operacionales** (`OperationOrder`, `OP-YYYY-XXXX`) con estados `SCHEDULED`, `IN_PROGRESS` y `COMPLETED` cuyo porcentaje de avance (`progressPct`) se calcula exclusivamente a partir de los hitos completados.

    ### Control de Acceso Basado en Roles (RBAC) y Seguridad
    - **`ADMIN` (Gerencia / Administración):** Acceso global consolidado a métricas/KPIs de todos los asesores, configuración de empresa y margen mínimo (`PUT /company`, `POST /company/uf-rate`), aprobación/rechazo de excepciones de margen, creación/edición/baja de catálogo y usuarios, bajas lógicas de clientes y contactos (`DELETE /customers/{id}`, `DELETE /contacts/{id}`), exportación CSV de auditoría y copias de seguridad (`GET /system/backup`, `POST /system/restore`).
    - **`SALES_REP` (Asesor Comercial):** Acceso estricto a sus propias cotizaciones, documentos de cobro, órdenes de trabajo y KPIs personales (`scope: PERSONAL`). Cualquier intento de consultar o modificar recursos o métricas de otro asesor o del administrador mediante `salesRepId` devuelve `403 Forbidden`.
    - **`CUSTOMER_CONTACT` (Portal Corporativo del Cliente):** Autenticación sin contraseña mediante **Enlace Mágico** de 32 bytes (SHA-256). Visualiza únicamente propuestas enviadas/aceptadas/rechazadas de su propia empresa en formato estrictamente sanitizado (`PublicQuotationDTO`, sin costos unitarios, márgenes, utilidad ni notas internas), documentos de cobro y seguimiento de órdenes de trabajo en modo lectura.
    - **Acceso Público Criptográfico (`/public/quotations/{token}`):** Sin autenticación de sesión (`security: []`), protegido por token criptográfico de alta entropía y limitador de tasa (`publicLimiter`).

servers:
  - url: /api/v1
    description: API v1 BFF (Express.js Backend For Frontend)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Autenticación de personal interno (scrypt + HMAC Bearer), Enlace Mágico para clientes y gestión de sesión
  - name: Dashboard
    description: Panel General de KPIs y métricas con aislamiento estricto por rol (Consolidado Admin vs Personal Asesor)
  - name: Quotations
    description: Ciclo de vida completo de cotizaciones, líneas, costos extra, revisiones, aprobaciones de margen y seguimiento
  - name: Public
    description: Enlaces públicos con token criptográfico para visualización, aceptación con firma digital, rechazo y ajustes
  - name: Portal
    description: Portal Corporativo B2B de autoservicio para contactos de clientes autenticados
  - name: Customers
    description: Cartera de clientes corporativos, contactos asociados y emisión/revocación de enlaces mágicos
  - name: Catalog
    description: Categorías técnicas, catálogo maestro de productos/servicios navales y kits compuestos
  - name: Templates
    description: Plantillas preconfiguradas de cotización por categoría técnica
  - name: Invoices
    description: Documentos de cobro (DC-XXXXXX), cronogramas de pago por hitos y registro de abonos en CLP
  - name: Operations
    description: Órdenes de trabajo (OP-YYYY-XXXX), hitos de proyecto y entregables técnicos con avance calculado
  - name: Company
    description: Parámetros institucionales, margen mínimo corporativo, piso duro, valor UF y gestión de equipo comercial
  - name: Notifications
    description: Bandeja de salida transaccional (Outbox) para Email y WhatsApp con reintentos auditados
  - name: Audit
    description: Registro inmutable de auditoría de eventos y exportación segura a CSV
  - name: Gemini AI
    description: Consultor técnico-comercial IA y extracción estructurada desde documentos/imágenes hacia borrador
  - name: System
    description: Estado de persistencia, carga de semilla idempotente, respaldo JSON y restauración validada

paths:
  # ==========================================
  # 1. AUTHENTICATION
  # ==========================================
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginStaff
      summary: Autenticación de personal interno (ADMIN / SALES_REP)
      description: |
        **Acceso:** Público (protegido por `authLimiter`: máx. 30 intentos / 15 min).
        Verifica credenciales con hash `scrypt` + sal aleatoria y emite un token HTTP Bearer firmado con HMAC-SHA256 junto con la lista de permisos RBAC del rol.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/magic-login:
    post:
      tags: [Auth]
      operationId: loginClientMagicLink
      summary: Autenticación sin contraseña mediante Enlace Mágico para clientes (CUSTOMER_CONTACT)
      description: |
        **Acceso:** Público (protegido por `authLimiter`).
        Valida el token criptográfico de enlace mágico (comparando su hash SHA-256 con `portalTokenHash`), verifica que no esté revocado ni expirado y que la empresa cliente esté activa.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLoginRequest'
      responses:
        '200':
          description: Ingreso al portal de cliente autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/switch-user:
    post:
      tags: [Auth]
      operationId: switchDemoUser
      summary: Cambio rápido de sesión entre roles para entorno de desarrollo/demostración
      description: |
        **Acceso:** Solo habilitado cuando `NODE_ENV !== 'production'`. En producción retorna `403 Forbidden`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: smorales@mlingenieria.cl
      responses:
        '200':
          description: Sesión cambiada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentStaffUser
      summary: Obtiene el usuario interno autenticado y sus permisos RBAC vigentes
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado y tiempo de expiración de sesión
          content:
            application/json:
              schema:
                type: object
                required: [user, role, permissions, expiresInMinutes]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  role:
                    $ref: '#/components/schemas/UserRole'
                  permissions:
                    type: array
                    items:
                      type: string
                  expiresInMinutes:
                    type: integer
                    example: 60
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutSession
      summary: Cierra la sesión actual del usuario
      description: |
        **Acceso:** Público / Autenticado. Confirma el cierre de sesión para que el cliente descarte el token Bearer.
      security: []
      responses:
        '200':
          description: Sesión cerrada con éxito
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Sesión cerrada con éxito

  # ==========================================
  # 2. DASHBOARD & METRICS (RBAC SCOPED)
  # ==========================================
  /dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      summary: Resumen de KPIs y métricas generales según el rol del usuario autenticado
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
        - **`ADMIN` (`dashboard:global`):** Obtiene el resumen global consolidado (`scope: GLOBAL`) de toda la compañía o filtrado opcionalmente por `?salesRepId`.
        - **`SALES_REP` (`dashboard:own`):** Solo visualiza su propio resumen y métricas personales (`scope: PERSONAL`, `salesRepId` forzado a su propio ID). Si solicita un `salesRepId` distinto al propio, el backend responde con `403 Forbidden`.
      security:
        - bearerAuth: []
      parameters:
        - name: salesRepId
          in: query
          required: false
          description: ID del asesor comercial a consultar (Solo permitido para `ADMIN` o cuando coincide con el propio ID del `SALES_REP`)
          schema:
            type: string
      responses:
        '200':
          description: Resumen de KPIs comerciales y operacionales en CLP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dashboard/by-sales-rep:
    get:
      tags: [Dashboard]
      operationId: getDashboardBySalesRep
      summary: Rendimiento y métricas desglosadas por asesor comercial
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`). También accesible mediante el alias `/dashboard/sales-reps`.
        - **`ADMIN` (`dashboard:by_sales_rep`):** Devuelve el listado comparativo de todos los asesores comerciales y administradores activos.
        - **`SALES_REP`:** Tiene restringido el acceso a las métricas del administrador y de otros asesores; recibe exclusivamente su propio registro o `403 Forbidden` si especifica un `salesRepId` ajeno.
      security:
        - bearerAuth: []
      parameters:
        - name: salesRepId
          in: query
          required: false
          description: Filtrar por ID de asesor comercial
          schema:
            type: string
      responses:
        '200':
          description: Arreglo de métricas por asesor comercial
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesRepSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dashboard/by-item-type:
    get:
      tags: [Dashboard]
      operationId: getDashboardByItemType
      summary: Comparativa de ventas, costos, utilidad y margen entre Productos y Servicios
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
        - **`ADMIN`:** Consolidado global o filtrado por `?salesRepId`.
        - **`SALES_REP`:** Acotado estrictamente a sus propias cotizaciones aceptadas (`403 Forbidden` si consulta otro `salesRepId`).
      security:
        - bearerAuth: []
      parameters:
        - name: salesRepId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Desglose financiero entre PRODUCT y SERVICE en CLP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeBreakdown'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dashboard/pipeline-metrics:
    get:
      tags: [Dashboard]
      operationId: getDashboardPipelineMetrics
      summary: KPIs avanzados de pipeline, ciclo de venta, ponderación y excepciones de margen
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
        Calcula en el servidor:
        1. Tasa de cierre (`closeRate`)
        2. Ciclo de venta promedio en días (`salesCycle`)
        3. Tiempo promedio hasta primera lectura del cliente (`timeToFirstView`)
        4. Pipeline neto ponderado por probabilidad de estado (`weightedPipeline`)
        5. Antigüedad promedio de cotizaciones enviadas (`sentAge`)
        6. Margen promedio aceptado vs mínimo corporativo (`acceptedMargin`)
        7. Ganadas/perdidas por categoría (`wonLostByCategory`) y por asesor (`wonLostBySalesRep`)
        8. Excepciones de margen (`marginExceptions`)
        Aplica aislamiento estricto por rol (`GLOBAL` para `ADMIN`, `PERSONAL` para `SALES_REP`).
      security:
        - bearerAuth: []
      parameters:
        - name: salesRepId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Métricas avanzadas del pipeline comercial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineMetricsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==========================================
  # 3. QUOTATIONS (CORE DOMAIN)
  # ==========================================
  /quotations:
    get:
      tags: [Quotations]
      operationId: listQuotations
      summary: Lista cotizaciones con filtrado por rol, estado, búsqueda y paginación opcional
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
        - **`ADMIN`:** Visualiza todas las cotizaciones o filtra por `salesRepId`.
        - **`SALES_REP`:** Solo visualiza sus propias cotizaciones (`salesRepId === req.user.id`). Si envía un `salesRepId` distinto, retorna `403 Forbidden`.
        - Si se envían `page` o `pageSize`, devuelve un objeto paginado (`PaginatedQuotations`); de lo contrario devuelve un arreglo de `Quotation`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/QuotationStatus'
        - name: customerId
          in: query
          schema:
            type: string
        - name: salesRepId
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Búsqueda por número de cotización, título o razón social del cliente
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            default: 15
      responses:
        '200':
          description: Listado de cotizaciones (arreglo directo o envoltorio paginado)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Quotation'
                  - $ref: '#/components/schemas/PaginatedQuotations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Quotations]
      operationId: createQuotationDraft
      summary: Paso 1 — Crea un nuevo borrador de cotización (DRAFT) con folio correlativo
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
        - Un `ADMIN` puede asignar la cotización a cualquier asesor mediante `salesRepId`.
        - Un `SALES_REP` siempre crea cotizaciones bajo su propia titularidad.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationCreateRequest'
      responses:
        '201':
          description: Borrador de cotización creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotations/follow-up/due:
    get:
      tags: [Quotations]
      operationId: listDueFollowUpQuotations
      summary: Lista cotizaciones con próxima acción comercial vencida (atrasada) o programada para hoy
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
        Filtra cotizaciones activas (no aceptadas ni rechazadas) cuyo `nextActionAt <= fin del día de hoy`. Aplica aislamiento por rol.
      security:
        - bearerAuth: []
      parameters:
        - name: salesRepId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de cotizaciones pendientes de seguimiento ordenadas por antigüedad
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /quotations/kpis:
    get:
      tags: [Quotations]
      operationId: getQuotationsRealtimeKpis
      summary: Obtiene métricas rápidas en tiempo real del listado de cotizaciones
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`). Restringido a las cotizaciones propias cuando el usuario es `SALES_REP`.
      security:
        - bearerAuth: []
      parameters:
        - name: salesRepId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Conteo por estado, valor total en pipeline, valor aceptado y tasa de cierre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationRealtimeKpis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /quotations/{id}:
    get:
      tags: [Quotations]
      operationId: getQuotationById
      summary: Obtiene el detalle completo de una cotización incluyendo costos, margen e historial de revisiones
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Detalle interno completo de la cotización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Quotations]
      operationId: updateQuotationSettings
      summary: Paso 4 y Autoguardado — Actualiza carta de presentación, notas, términos, validez y descuento
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
        Solo permitido en estados `DRAFT` o `PENDING_APPROVAL` y sobre la última revisión vigente (`isLatestRevision !== false`). Soporta control de concurrencia optimista mediante `expectedUpdatedAt` y `expectedStatus`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationSettingsUpdateRequest'
      responses:
        '200':
          description: Configuración de cotización actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /quotations/{id}/lines:
    put:
      tags: [Quotations]
      operationId: replaceQuotationLines
      summary: Paso 2 — Reemplaza líneas de cotización, recalcula totales CLP/IVA 19% y valida márgenes
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
        - El servidor deriva `cost`, `name` y `unit` directamente del catálogo oficial ignorando cualquier costo enviado por el cliente.
        - Las líneas libres sin `catalogItemId` exigen rol `ADMIN` (`403 Forbidden` para `SALES_REP`).
        - Si el margen ponderado cae bajo el piso duro (`hardMinMarginPct`), responde `422 Unprocessable Entity` (`MarginProblemDetails`).
        - Si el margen cae entre el piso duro y el mínimo corporativo (`minMarginPct`), la cotización cambia automáticamente a `PENDING_APPROVAL`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuotationLinesRequest'
      responses:
        '200':
          description: Líneas y totales financieros actualizados en CLP y UF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Margen comercial inferior al piso duro corporativo no negociable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MarginProblemDetails'

  /quotations/{id}/extra-costs:
    put:
      tags: [Quotations]
      operationId: replaceQuotationExtraCosts
      summary: Paso 3 — Reemplaza costos adicionales informativos (viáticos, fletes, logística)
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
        Los costos adicionales son informativos y no alteran el margen comercial ni el total facturable de las líneas principales.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuotationExtraCostsRequest'
      responses:
        '200':
          description: Costos adicionales actualizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /quotations/{id}/send:
    post:
      tags: [Quotations]
      operationId: sendQuotation
      summary: Formaliza y envía la cotización al cliente (DRAFT -> SENT) encolando mensaje en Outbox
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
        Exige al menos una línea cargada y margen comercial válido (o excepción de margen `APPROVED` por `ADMIN`). Calcula `validUntil` según `validityDays` y despacha la notificación por `EMAIL` o `WHATSAPP`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [EMAIL, WHATSAPP]
                  default: EMAIL
                expectedUpdatedAt:
                  type: string
                expectedStatus:
                  type: string
      responses:
        '200':
          description: Cotización enviada y registrada en bandeja de salida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /quotations/{id}/status:
    post:
      tags: [Quotations]
      operationId: updateQuotationStatus
      summary: Actualización controlada de estado de la cotización
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
        **Reglas de Integridad:**
        - El personal interno **no puede** fijar `ACCEPTED`, `REJECTED` ni `VIEWED` manualmente por este endpoint (`403 Forbidden`).
        - Una cotización `ACCEPTED` nunca puede volver a `DRAFT` (`400 Bad Request`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationStatusUpdateRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /quotations/{id}/next-action:
    patch:
      tags: [Quotations]
      operationId: patchQuotationNextAction
      summary: Programa o marca como completada la próxima acción de seguimiento comercial
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
        Si `nextActionAt` se envía como `null` o vacío, la acción de seguimiento actual se marca como completada en el historial.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationNextActionRequest'
      responses:
        '200':
          description: Seguimiento comercial actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Quotations]
      operationId: postQuotationNextAction
      summary: Programa o marca como completada la próxima acción comercial (Alias POST)
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationNextActionRequest'
      responses:
        '200':
          description: Seguimiento comercial actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotations/{id}/reminder:
    post:
      tags: [Quotations]
      operationId: sendQuotationFollowUpReminder
      summary: Encola un recordatorio comercial de seguimiento en la bandeja de salida (Outbox)
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`). También soporta el alias `/quotations/{id}/follow-up-reminder`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [EMAIL, WHATSAPP]
                  default: EMAIL
                note:
                  type: string
      responses:
        '200':
          description: Recordatorio encolado exitosamente
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  outboxMessage:
                    $ref: '#/components/schemas/OutboxMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotations/{id}/reject:
    post:
      tags: [Quotations]
      operationId: rejectQuotationByStaff
      summary: Desestima una cotización registrando un motivo de pérdida configurable
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
        Valida que `lossReason` pertenezca al catálogo configurado en `company.lossReasons` (p. ej. `precio`, `plazo`, `competencia`, `proyecto aplazado`, `otro`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationRejectByStaffRequest'
      responses:
        '200':
          description: Cotización marcada como REJECTED con motivo de pérdida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /quotations/{id}/duplicate:
    post:
      tags: [Quotations]
      operationId: duplicateQuotation
      summary: Duplica una cotización existente como un nuevo borrador independiente
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`). Genera un nuevo folio correlativo y estado `DRAFT`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: Nueva cotización duplicada en borrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotations/{id}/revisions:
    get:
      tags: [Quotations]
      operationId: listQuotationRevisions
      summary: Obtiene el historial completo de revisiones del grupo de la cotización
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Grupo de revisiones ordenado de la más reciente a la original
          content:
            application/json:
              schema:
                type: object
                required: [quotationGroupId, revisions]
                properties:
                  quotationGroupId:
                    type: string
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Quotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Quotations]
      operationId: createQuotationRevision
      summary: Crea una nueva revisión correlativa (COT-XXXXXX-RN) y marca las anteriores como superadas
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
        La versión anterior queda inmutable (`isLatestRevision: false`) y la nueva nace en estado `DRAFT` bajo el mismo `quotationGroupId`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: Nueva revisión creada en estado borrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotations/{id}/accept-offline:
    post:
      tags: [Quotations]
      operationId: acceptQuotationOffline
      summary: Registra aceptación offline con Orden de Compra (OC) y emite automáticamente el Documento de Cobro
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
        Exige `purchaseOrderNumber` y `offlineNote`. Pasa la cotización a `ACCEPTED` y genera inmediatamente su factura/documento de cobro (`DC-XXXXXX`) con cronograma de hitos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationOfflineAcceptRequest'
      responses:
        '200':
          description: Aceptación offline registrada y factura generada
          content:
            application/json:
              schema:
                type: object
                required: [success, message, quotation]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  quotation:
                    $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /quotations/{id}/request-margin-approval:
    post:
      tags: [Quotations]
      operationId: requestMarginApproval
      summary: Solicita excepción de margen comercial a Gerencia/Administración
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
        Solo permitido si `marginPct >= hardMinMarginPct`. Cambia el estado de la cotización a `PENDING_APPROVAL` y `marginApprovalStatus: 'PENDING'`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: Cliente estratégico adjudicará contrato anual de mantención de flota si igualamos tarifa.
      responses:
        '200':
          description: Solicitud de excepción de margen registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /quotations/{id}/approve-margin:
    post:
      tags: [Quotations]
      operationId: approveQuotationMarginException
      summary: Aprueba una excepción de margen comercial (Exclusivo ADMIN)
      description: |
        **Rol requerido:** Exclusivo `ADMIN` (`bearerAuth`).
        Marca `marginException: true`, `marginApprovalStatus: 'APPROVED'` y habilita la cotización en `DRAFT` para ser enviada al cliente.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 1000
                  example: Autorizado por Gerencia Comercial dado volumen anual del armador.
      responses:
        '200':
          description: Excepción de margen aprobada por Administración
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /quotations/{id}/reject-margin:
    post:
      tags: [Quotations]
      operationId: rejectQuotationMarginException
      summary: Rechaza una excepción de margen comercial con comentario obligatorio (Exclusivo ADMIN)
      description: |
        **Rol requerido:** Exclusivo `ADMIN` (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: No se autoriza descuento adicional en repuestos importados; ajustar cantidades o precio.
      responses:
        '200':
          description: Excepción de margen rechazada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotations/{id}/attachments:
    post:
      tags: [Quotations]
      operationId: addQuotationAttachment
      summary: Añade un documento o enlace técnico adjunto a la cotización
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentCreateRequest'
      responses:
        '201':
          description: Adjunto agregado a la cotización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotations/{id}/attachments/{attachmentId}:
    delete:
      tags: [Quotations]
      operationId: removeQuotationAttachment
      summary: Elimina un archivo o enlace adjunto de la cotización
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Adjunto eliminado correctamente
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # 4. PUBLIC QUOTATION ENDPOINTS (TOKEN-BASED)
  # ==========================================
  /public/quotations/{token}:
    get:
      tags: [Public]
      operationId: getPublicQuotationByToken
      summary: Consulta pública idempotente de cotización mediante token criptográfico
      description: |
        **Acceso:** Público sin sesión (`security: []`), protegido por `publicLimiter` (60 req/min).
        - **Idempotente:** No altera el estado de la cotización.
        - **Sanitización Estricta:** Devuelve un `PublicQuotationDTO` que **jamás** expone costos unitarios (`cost`), utilidad (`profit`), margen (`marginPct`) ni notas internas (`internalNotes`).
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicToken'
      responses:
        '200':
          description: Vista pública sanitizada de la cotización y datos de empresa/asesor
          content:
            application/json:
              schema:
                type: object
                required: [quotation, company]
                properties:
                  quotation:
                    $ref: '#/components/schemas/PublicQuotationDTO'
                  customer:
                    type: object
                    properties:
                      businessName: { type: string }
                      taxId: { type: string }
                      address: { type: string }
                  contact:
                    type: object
                    properties:
                      name: { type: string }
                      email: { type: string }
                      phone: { type: string }
                  salesRep:
                    type: object
                    properties:
                      name: { type: string }
                      email: { type: string }
                      phone: { type: string }
                  company:
                    type: object
                    properties:
                      name: { type: string }
                      legalName: { type: string }
                      rut: { type: string }
                      address: { type: string }
                      phone: { type: string }
                      email: { type: string }
                      currency: { type: string, example: CLP }
                      taxRatePct: { type: number, example: 19 }
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /public/quotations/{token}/view:
    post:
      tags: [Public]
      operationId: registerPublicQuotationView
      summary: Registra la apertura genuina de la cotización por parte del cliente (SENT -> VIEWED)
      description: |
        **Acceso:** Público (`security: []`).
        Si la petición incluye un header `Authorization: Bearer` perteneciente a personal interno (`ADMIN` o `SALES_REP`), el servidor devuelve `isStaffPreview: true` sin modificar el estado comercial de la cotización.
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicToken'
      responses:
        '200':
          description: Lectura registrada o previsualización de staff ignorada
          content:
            application/json:
              schema:
                type: object
                required: [success, status]
                properties:
                  success: { type: boolean }
                  status: { $ref: '#/components/schemas/QuotationStatus' }
                  isStaffPreview: { type: boolean }
                  firstViewedAt: { type: string, format: date-time }
                  message: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /public/quotations/{token}/accept:
    post:
      tags: [Public]
      operationId: acceptPublicQuotation
      summary: El cliente acepta formalmente la cotización con firma digital y genera el Documento de Cobro
      description: |
        **Acceso:** Público mediante token criptográfico (`security: []`).
        - Exige `termsAccepted: true`, `signerName` y `signerPosition`.
        - Registra IP, hash SHA-256 de User-Agent y `acceptanceHash` inmutable.
        - Emite automáticamente el Documento de Cobro (`Invoice` `DC-XXXXXX`) en CLP con IVA 19% y su cronograma de pagos.
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicQuotationAcceptRequest'
      responses:
        '200':
          description: Cotización aceptada formalmente
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  quotation: { $ref: '#/components/schemas/PublicQuotationDTO' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /public/quotations/{token}/reject:
    post:
      tags: [Public]
      operationId: rejectPublicQuotation
      summary: El cliente desestima o rechaza la cotización
      description: |
        **Acceso:** Público mediante token criptográfico (`security: []`).
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Presupuesto excede partida asignada para este trimestre
                lossReason:
                  type: string
                  example: precio
                expectedUpdatedAt:
                  type: string
      responses:
        '200':
          description: Cotización rechazada por el cliente
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  quotation: { $ref: '#/components/schemas/PublicQuotationDTO' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /public/quotations/{token}/request-adjustment:
    post:
      tags: [Public]
      operationId: requestPublicQuotationAdjustment
      summary: El cliente solicita modificaciones o ajustes sobre la propuesta (CHANGES_REQUESTED)
      description: |
        **Acceso:** Público mediante token criptográfico (`security: []`).
        Cambia el estado a `CHANGES_REQUESTED` y encola notificación al asesor comercial asignado.
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  example: Favor cotizar adicionalmente calibración de válvulas de casco en dique seco.
                expectedUpdatedAt:
                  type: string
      responses:
        '200':
          description: Solicitud de ajuste registrada y enviada al asesor
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  quotation: { $ref: '#/components/schemas/PublicQuotationDTO' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ==========================================
  # 5. CLIENT PORTAL (CUSTOMER_CONTACT)
  # ==========================================
  /portal/me:
    get:
      tags: [Portal]
      operationId: getPortalCurrentClient
      summary: Obtiene el perfil del contacto de cliente autenticado y su empresa asociada
      description: |
        **Rol requerido:** `CUSTOMER_CONTACT` (`bearerAuth` con Magic Token o sesión de cliente).
      security:
        - bearerAuth: []
      responses:
        '200':
