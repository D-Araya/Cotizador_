          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  customer:
                    $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /portal/summary:
    get:
      tags: [Portal]
      operationId: getPortalSummary
      summary: Resumen de cotizaciones de la empresa del cliente (Total, Aceptadas, Pendientes, Rechazadas)
      description: |
        **Rol requerido:** `CUSTOMER_CONTACT` (`bearerAuth`).
        El `customerId` se deriva estrictamente del token de sesión; si se envía un `?customerId=` perteneciente a otra empresa, retorna `403 Forbidden`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conteo de cotizaciones del cliente (excluyendo borradores)
          content:
            application/json:
              schema:
                type: object
                required: [total, accepted, pending, rejected]
                properties:
                  total: { type: integer, example: 8 }
                  accepted: { type: integer, example: 4 }
                  pending: { type: integer, example: 3 }
                  rejected: { type: integer, example: 1 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /portal/quotations:
    get:
      tags: [Portal]
      operationId: listPortalQuotations
      summary: Lista las cotizaciones de la empresa del cliente autenticado (vista sanitizada sin borradores)
      description: |
        **Rol requerido:** `CUSTOMER_CONTACT` (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/QuotationStatus'
      responses:
        '200':
          description: Lista de cotizaciones sanitizadas (`PublicQuotationDTO`)
          content:
            application/json:
              schema:
