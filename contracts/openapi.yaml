        validUntil: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        currency: { type: string, enum: [CLP], example: CLP }
        grossSubtotal: { type: integer }
        discountPct: { type: number }
        discountAmount: { type: integer }
        totalSavings: { type: integer }
        netSubtotal: { type: integer, example: 2850000 }
        subtotal: { type: integer, example: 2850000 }
        taxRatePct: { type: number, example: 19 }
        taxAmount: { type: integer, example: 541500 }
        grandTotal: { type: integer, example: 3391500 }
        total: { type: integer, example: 3391500 }
        ufRate: { type: number, example: 38500 }
        ufNetSubtotal: { type: number, example: 74.03 }
        ufGrandTotal: { type: number, example: 88.09 }
        presentationText: { type: string }
        notes: { type: string }
        terms: { type: string }
        clientSignerName: { type: string }
        clientSignerPosition: { type: string }
        acceptanceHash: { type: string }
        acceptedOffline: { type: boolean }
        offlinePurchaseOrderNumber: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [id, name, unit, quantity, unitPrice, subtotal]
            properties:
              id: { type: string }
              type: { type: string, enum: [PRODUCT, SERVICE] }
              name: { type: string }
              skuOrCode: { type: string }
              unit: { type: string }
              quantity: { type: number }
              originalUnitPrice: { type: integer }
              unitPrice: { type: integer }
              price: { type: integer }
              discountPct: { type: number }
              discountAmount: { type: integer }
              subtotal: { type: integer }
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/QuotationAttachment'
        timelineEvents:
          type: array
          items:
            type: object
            required: [title, description, timestamp]
            properties:
              title: { type: string }
              description: { type: string }
              timestamp: { type: string, format: date-time }

    QuotationCreateRequest:
      type: object
      required: [customerId]
