      operationId: getPortalTimeline
      summary: Obtiene el historial cronológico de eventos comerciales orientados al cliente
      description: |
        **Rol requerido:** `CUSTOMER_CONTACT` (`bearerAuth`). Filtra cualquier nota interna del personal.
