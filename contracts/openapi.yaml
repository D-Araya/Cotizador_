          description: Total general con IVA en CLP (entero sin decimales)
          example: 3391500
        paidAmount:
          type: integer
          description: Total abonado a la fecha en CLP (entero sin decimales)
          example: 1695750
        balance:
          type: integer
          description: Saldo pendiente de pago en CLP (entero sin decimales)
          example: 1695750
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        paymentMethod:
          type: string
        paymentTerms:
          type: string
          example: 50% anticipo, 50% contra entrega
        paidAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        paymentSchedule:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMilestone'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/InvoicePaymentRecord'

    RecordPaymentRequest:
      type: object
      required: [amount, paymentMethod, reference]
      properties:
        amount:
          type: integer
          minimum: 1
          description: Monto a abonar en CLP (entero positivo)
          example: 1695750
        paymentMethod:
          type: string
          enum:
            - TRANSFER
            - CHECK
            - VALE_VISTA
            - CREDIT_CARD
            - DEBIT_CARD
            - CASH
            - TRANSFERENCIA_BANCARIA
            - CHEQUE
            - EFECTIVO
            - TARJETA_CREDITO
            - WEBPAY
            - OTRO
        reference:
          type: string
          minLength: 1
          example: TRF-998812
        paymentDate:
          type: string
          format: date
        notes:
          type: string
          maxLength: 1000

    # ==========================================
    # OPERATIONS SCHEMAS
    # ==========================================
    OperationType:
      type: string
      enum: [PRODUCT_DELIVERY, SERVICE_EXECUTION]

    OperationStatus:
      type: string
      enum: [SCHEDULED, IN_PROGRESS, COMPLETED]

    OperationMilestoneStatus:
      type: string
      enum: [PENDING, IN_PROGRESS, COMPLETED]

    OperationDeliverableStatus:
      type: string
      enum: [PENDING, READY, DELIVERED]

    DeliverableAttachment:
      type: object
      required: [id, name, url, addedAt]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        description: { type: string }
        addedAt: { type: string, format: date-time }

    OperationMilestone:
      type: object
      required: [id, name, date, status]
      properties:
        id: { type: string }
        name: { type: string, example: Inspección en Dique y Levantamiento Dimensional }
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/OperationMilestoneStatus' }
        completedAt: { type: string, format: date-time }

    OperationDeliverable:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string, example: Cuadernillo de Estabilidad Aprobado por DIRECTEMAR }
        status: { $ref: '#/components/schemas/OperationDeliverableStatus' }
        link: { type: string }
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/DeliverableAttachment'

    OperationOrder:
      type: object
      required:
        - id
        - orderNumber
        - quotationId
        - quotationNumber
        - customerId
        - customerBusinessName
        - type
        - title
        - description
        - status
        - progressPct
        - assignedStaff
        - scheduledDate
        - itemsIncluded
      properties:
        id:
          type: string
        orderNumber:
          type: string
          example: OP-2026-0042
        quotationId:
          type: string
        quotationNumber:
          type: string
          example: COT-000259
        customerId:
          type: string
        customerBusinessName:
          type: string
        type:
          $ref: '#/components/schemas/OperationType'
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/OperationStatus'
        progressPct:
          type: integer
          minimum: 0
          maximum: 100
          description: Porcentaje de avance calculado exclusivamente a partir de los hitos completados
          example: 67
        assignedStaff:
          type: string
          example: Ing. Naval Rodrigo Mansilla
        scheduledDate:
          type: string
          format: date
        completedDate:
          type: string
          format: date
        deliveryAddress:
          type: string
        guideNumber:
          type: string
          example: GD-000412
        itemsIncluded:
          type: array
          items:
            type: string
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/OperationMilestone'
        deliverables:
          type: array
          items:
            $ref: '#/components/schemas/OperationDeliverable'

    OperationOrderCreateRequest:
      type: object
      required: [quotationId, type, title]
      properties:
        quotationId: { type: string }
        type: { $ref: '#/components/schemas/OperationType' }
        title: { type: string }
        description: { type: string }
        scheduledDate: { type: string, format: date }
        assignedStaff: { type: string }
        deliveryAddress: { type: string }
        milestones:
          type: array
          items:
            type: object
            required: [name, date]
            properties:
              name: { type: string }
              date: { type: string, format: date }
              status: { $ref: '#/components/schemas/OperationMilestoneStatus' }
        deliverables:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              status: { $ref: '#/components/schemas/OperationDeliverableStatus' }
              link: { type: string }

    OperationOrderUpdateRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/OperationStatus' }
        guideNumber: { type: string }
        assignedStaff: { type: string }
        completedDate: { type: string, format: date }
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/OperationMilestone'
        deliverables:
          type: array
          items:
            $ref: '#/components/schemas/OperationDeliverable'

    # ==========================================
    # DASHBOARD & METRICS SCHEMAS
    # ==========================================
    ItemTypeBreakdown:
      type: object
      required: [products, services]
      properties:
        products:
          type: object
          required: [count, revenue, sales, cost, profit, marginPct]
          properties:
            count: { type: number }
            revenue: { type: integer, description: Ingresos netos en CLP }
            sales: { type: integer, description: Ventas netas en CLP }
            cost: { type: integer, description: Costos netos en CLP }
            profit: { type: integer, description: Utilidad neta en CLP }
            marginPct: { type: number }
        services:
          type: object
          required: [count, revenue, sales, cost, profit, marginPct]
          properties:
            count: { type: number }
            revenue: { type: integer, description: Ingresos netos en CLP }
            sales: { type: integer, description: Ventas netas en CLP }
            cost: { type: integer, description: Costos netos en CLP }
            profit: { type: integer, description: Utilidad neta en CLP }
            marginPct: { type: number }

    DashboardSummary:
      type: object
      required:
        - scope
        - totalQuotations
        - accepted
        - sent
        - viewed
        - drafts
        - rejected
        - totalValue
        - acceptedValue
        - acceptanceRate
        - avgMargin
        - totalProfit
        - activeOperations
        - pendingInvoices
      properties:
        scope:
          type: string
          enum: [GLOBAL, PERSONAL]
          description: GLOBAL para Administrador consolidado; PERSONAL para Asesor Comercial o filtro por asesor
        salesRepId:
          type: ['string', 'null']
        totalQuotations: { type: integer }
        totalQuotes: { type: integer }
        accepted: { type: integer }
        totalAccepted: { type: integer }
        sent: { type: integer }
        totalSent: { type: integer }
        viewed: { type: integer }
        totalViewed: { type: integer }
        drafts: { type: integer }
        rejected: { type: integer }
        totalRejected: { type: integer }
        totalValue:
          type: integer
          description: Valor total cotizado en CLP (entero sin decimales)
        acceptedValue:
          type: integer
          description: Valor total adjudicado/aceptado en CLP (entero sin decimales)
        totalAcceptedSales:
          type: integer
        acceptanceRate: { type: number }
        avgMargin: { type: number }
        avgMarginPct: { type: number }
        totalProfit:
          type: integer
          description: Utilidad neta acumulada en CLP
        activeOperations: { type: integer }
        pendingInvoices: { type: integer }
        itemTypeBreakdown:
          $ref: '#/components/schemas/ItemTypeBreakdown'

    SalesRepSummary:
      type: object
      required:
        - salesRepId
        - salesRepName
        - totalQuotations
        - accepted
        - rejected
        - viewed
        - sent
        - totalAmount
        - totalSales
        - avgMarginPct
        - acceptanceRate
      properties:
        salesRepId: { type: string }
        salesRepName: { type: string }
        name: { type: string }
        totalQuotations: { type: integer }
        totalQuotes: { type: integer }
        acceptedQuotations: { type: integer }
        accepted: { type: integer }
        rejected: { type: integer }
        viewed: { type: integer }
        sent: { type: integer }
        totalAmount:
          type: integer
          description: Monto total cotizado en CLP
        totalSales:
          type: integer
          description: Monto total adjudicado (ACCEPTED) en CLP
        avgMarginPct: { type: number }
        acceptanceRate: { type: number }

    QuotationRealtimeKpis:
      type: object
      required:
        - total
        - draft
        - sent
        - viewed
        - changesRequested
        - accepted
        - rejected
        - expired
        - totalPipelineValue
        - acceptedValue
        - winRate
      properties:
        total: { type: integer }
        draft: { type: integer }
        sent: { type: integer }
        viewed: { type: integer }
        changesRequested: { type: integer }
        accepted: { type: integer }
        rejected: { type: integer }
        expired: { type: integer }
        totalPipelineValue: { type: integer }
        acceptedValue: { type: integer }
        winRate: { type: number }

    PipelineMetricsResponse:
      type: object
      required:
        - scope
        - closeRate
        - salesCycle
        - timeToFirstView
        - weightedPipeline
        - sentAge
        - acceptedMargin
        - wonLostByCategory
        - wonLostBySalesRep
        - marginExceptions
      properties:
        scope:
          type: string
          enum: [GLOBAL, PERSONAL]
        salesRepId:
          type: ['string', 'null']
        closeRate:
          type: object
          properties:
            value: { type: number }
            acceptedCount: { type: integer }
            decidedCount: { type: integer }
            definition: { type: string }
        salesCycle:
          type: object
          properties:
            avgDays: { type: number }
            decidedCount: { type: integer }
            definition: { type: string }
        timeToFirstView:
          type: object
          properties:
            avgHours: { type: number }
            avgDays: { type: number }
            viewedCount: { type: integer }
            definition: { type: string }
        weightedPipeline:
          type: object
          properties:
            amount: { type: integer, description: Valor neto ponderado en CLP }
            totalPipelineNet: { type: integer, description: Valor neto total en pipeline en CLP }
            activeQuotesCount: { type: integer }
            probabilities:
              type: object
              additionalProperties: { type: number }
            definition: { type: string }
        sentAge:
          type: object
          properties:
            avgDays: { type: number }
            pendingCount: { type: integer }
            definition: { type: string }
        acceptedMargin:
          type: object
          properties:
            avgMarginPct: { type: number }
            minMarginPct: { type: number }
            deltaPct: { type: number }
            definition: { type: string }
        wonLostByCategory:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  categoryId: { type: string }
                  categoryName: { type: string }
                  wonCount: { type: integer }
                  lostCount: { type: integer }
                  wonAmount: { type: integer }
                  lostAmount: { type: integer }
            definition: { type: string }
        wonLostBySalesRep:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  salesRepId: { type: string }
                  salesRepName: { type: string }
                  wonCount: { type: integer }
                  lostCount: { type: integer }
                  wonAmount: { type: integer }
                  lostAmount: { type: integer }
                  closeRatePct: { type: number }
            definition: { type: string }
        marginExceptions:
          type: object
          properties:
            count: { type: integer }
            pendingApprovalCount: { type: integer }
            items:
              type: array
              items:
                type: object
            definition: { type: string }

    # ==========================================
    # NOTIFICATIONS, AUDIT & SYSTEM SCHEMAS
    # ==========================================
    OutboxMessage:
      type: object
      required: [id, channel, recipient, recipientName, body, status, retries, createdAt]
      properties:
        id: { type: string }
        quotationId: { type: string }
        quotationNumber: { type: string }
        channel: { type: string, enum: [EMAIL, WHATSAPP] }
        recipient: { type: string }
        recipientEmail: { type: string }
        recipientName: { type: string }
        recipientPhone: { type: string }
        subject: { type: string }
        body: { type: string }
        bodyPreview: { type: string }
        status: { type: string, enum: [PENDING, SENT, FAILED, PENDING_MANUAL] }
        retries: { type: integer }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
        whatsAppUrl: { type: string }

    AuditLog:
      type: object
      required: [id, entity, action, entityId, description, timestamp]
      properties:
        id: { type: string }
        entity:
          type: string
          enum: [CATALOG, CUSTOMERS, CONTACTS, QUOTATIONS, COMPANY, USERS, INVOICES, OPERATIONS, OUTBOX, SYSTEM]
        action: { type: string }
        entityId: { type: string }
        entityName: { type: string }
        description: { type: string }
        summary: { type: string }
        actorId: { type: string }
        actorName: { type: string }
        actorRole: { type: string }
        timestamp: { type: string, format: date-time }

    SystemBackupPayload:
      type: object
      required: [company, categories, catalogItems, customers, contacts, quotations]
      properties:
        exportedAt: { type: string, format: date-time }
        version: { type: string, example: 2.0.0 }
        company: { $ref: '#/components/schemas/CompanySettings' }
        users:
          type: array
          items: { $ref: '#/components/schemas/User' }
        customers:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        contacts:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        catalogItems:
          type: array
          items: { $ref: '#/components/schemas/CatalogItem' }
        quotations:
          type: array
          items: { $ref: '#/components/schemas/Quotation' }
        invoices:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
        operations:
          type: array
          items: { $ref: '#/components/schemas/OperationOrder' }
        outbox:
          type: array
          items: { $ref: '#/components/schemas/OutboxMessage' }
        auditLogs:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }

    # ==========================================
    # PAGINATED WRAPPERS
    # ==========================================
    PaginatedQuotations:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Quotation' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    PaginatedCustomers:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    PaginatedCatalogItems:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogItem' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    PaginatedInvoices:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    PaginatedOperations:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OperationOrder' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    PaginatedNotifications:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OutboxMessage' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    PaginatedAuditLogs:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
