  # ==========================================
  # 6. CUSTOMERS & CONTACTS
  # ==========================================
  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Lista la cartera de clientes corporativos activos
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Búsqueda por razón social o RUT (`taxId`)
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista de clientes o respuesta paginada
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Customer'
