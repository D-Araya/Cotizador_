        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Usuario dado de baja lógicamente
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # 11. NOTIFICATIONS OUTBOX
  # ==========================================
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotificationsOutbox
      summary: Lista los mensajes transaccionales en la Bandeja de Salida (Outbox: Email y WhatsApp)
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`). También disponible en los alias `/notifications/outbox` y `/outbox`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, SENT, FAILED, PENDING_MANUAL]
        - name: channel
          in: query
          schema:
            type: string
            enum: [EMAIL, WHATSAPP]
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista de notificaciones Outbox o envoltorio paginado
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/OutboxMessage'
                  - $ref: '#/components/schemas/PaginatedNotifications'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{id}/retry:
    post:
      tags: [Notifications]
      operationId: retryOutboxNotification
      summary: Ejecuta un reintento manual de envío de una notificación en Outbox (Exclusivo ADMIN)
      description: |
        **Rol requerido:** Exclusivo `ADMIN` (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Reintento procesado
          content:
            application/json:
              schema:
                type: object
                required: [success, message, outboxMessage]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  outboxMessage: { $ref: '#/components/schemas/OutboxMessage' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # 12. AUDIT LOGS
  # ==========================================
  /audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: Consulta el registro inmutable de auditoría con filtros y paginación
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - name: entity
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista de eventos de auditoría o envoltorio paginado
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  - $ref: '#/components/schemas/PaginatedAuditLogs'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /audit-logs/export-csv:
    get:
      tags: [Audit]
      operationId: exportAuditLogsCsv
      summary: Exporta los registros de auditoría en formato CSV UTF-8 con BOM y protección anti-inyección de fórmulas (Exclusivo ADMIN)
      description: |
        **Rol requerido:** Exclusivo `ADMIN` (`bearerAuth`).
        Neutraliza cualquier celda que comience con `=`, `+`, `-`, `@` prefijándola con apóstrofe (`'`) para prevenir CSV Formula Injection.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Archivo CSV descargable
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==========================================
  # 13. GEMINI AI INTEGRATIONS
  # ==========================================
  /gemini/chat:
    post:
      tags: [Gemini AI]
      operationId: chatWithGeminiAdvisor
      summary: Consultor Técnico y Comercial IA especializado en ingeniería naval, márgenes y normativa chilena
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`, protegido por `geminiLimiter`: 30 req/min).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 10000
                history:
                  type: array
                  items:
                    type: object
                    required: [role, text]
                    properties:
                      role:
                        type: string
                        enum: [user, model]
                      text:
                        type: string
                        maxLength: 10000
      responses:
        '200':
          description: Respuesta generada por el asistente técnico-comercial
          content:
            application/json:
              schema:
                type: object
                required: [reply]
                properties:
                  reply:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gemini/analyze-document:
    post:
      tags: [Gemini AI]
      operationId: analyzeTechnicalDocument
      summary: Analiza un documento o plano técnico en base64 (imagen o PDF hasta 10 MB)
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`, protegido por `geminiLimiter`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageBase64, mimeType]
              properties:
                imageBase64:
                  type: string
                  description: Contenido codificado en Base64
                mimeType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, image/gif, application/pdf]
                prompt:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Análisis técnico extraído del documento
          content:
            application/json:
              schema:
                type: object
                required: [analysis]
                properties:
                  analysis:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gemini/analyze-request-image:
    post:
      tags: [Gemini AI]
      operationId: analyzeRequestImageToDraft
      summary: Del documento al borrador — Extrae ítems de una solicitud y los contrasta con el catálogo oficial
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`, protegido por `geminiLimiter`).
        - Contrasta cada ítem detectado contra el catálogo activo.
        - **Regla anti-alucinación:** Jamás inventa precios ni costos; los ítems no encontrados en el catálogo quedan marcados como `POR-COTIZAR` con `cost: 0` y `price: 0`.
        - Redacta además una propuesta de carta de presentación técnica (`draftPresentationText`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageBase64:
                  type: string
                mimeType:
                  type: string
                simulatedText:
                  type: string
      responses:
        '200':
          description: Líneas sugeridas contrastadas con el catálogo y borrador de carta de presentación
          content:
            application/json:
              schema:
                type: object
                required: [success, suggestedLines, draftPresentationText, matchedCount, unmatchedCount]
                properties:
                  success: { type: boolean }
                  suggestedLines:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        catalogItemId: { type: string }
                        type: { type: string, enum: [PRODUCT, SERVICE] }
                        skuOrCode: { type: string }
                        name: { type: string }
                        unit: { type: string }
                        cost: { type: integer }
                        price: { type: integer }
                        marginPct: { type: number }
                        quantity: { type: number }
                        subtotal: { type: integer }
                        costTotal: { type: integer }
                        matched: { type: boolean }
                        notes: { type: string }
                  draftPresentationText: { type: string }
                  matchedCount: { type: integer }
                  unmatchedCount: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # 14. SYSTEM, SEED & BACKUP/RESTORE
  # ==========================================
  /system/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: Devuelve el estado del motor de persistencia (Firestore vs Memoria Demo)
      description: |
        **Acceso:** Público (`security: []`).
      security: []
      responses:
        '200':
          description: Estado del backend de datos
          content:
            application/json:
              schema:
                type: object
                required: [backend, isDemoMode, message]
                properties:
                  backend:
                    type: string
                    example: memory
                  isDemoMode:
                    type: boolean
                  message:
                    type: string

  /system/seed:
    post:
      tags: [System]
      operationId: runSystemSeed
      summary: Ejecuta la carga inicial idempotente de datos semilla (Exclusivo ADMIN)
      description: |
        **Rol requerido:** Exclusivo `ADMIN` (`bearerAuth`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resultado de la operación de semilla
          content:
            application/json:
              schema:
                type: object
                properties:
                  seeded: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /system/backup:
    get:
      tags: [System]
      operationId: downloadSystemBackup
      summary: Descarga una copia de seguridad JSON completa y sanitizada del sistema (Exclusivo ADMIN)
      description: |
        **Rol requerido:** Exclusivo `ADMIN` (`bearerAuth`).
        Excluye `passwordHash`, `passwordSalt` y `portalTokenHash` del archivo exportado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Snapshot JSON descargable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBackupPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /system/restore:
    post:
      tags: [System]
      operationId: restoreSystemBackup
      summary: Restaura la base de datos desde un respaldo JSON validado con Zod (Exclusivo ADMIN)
      description: |
        **Rol requerido:** Exclusivo `ADMIN` (`bearerAuth`).
        Valida la integridad estructural con `restoreBackupSchema` y sanitiza recursivamente las claves para prevenir Prototype Pollution (`__proto__`, `constructor`, `prototype`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemBackupPayload'
      responses:
        '200':
          description: Sistema restaurado exitosamente
          content:
            application/json:
              schema:
                type: object
                required: [success, message, restoredCounts]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  restoredCounts:
                    type: object
                    properties:
                      before:
                        type: object
                        properties:
                          quotations: { type: integer }
                          customers: { type: integer }
                          catalogItems: { type: integer }
                      after:
                        type: object
                        properties:
                          quotations: { type: integer }
                          customers: { type: integer }
                          catalogItems: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HMAC-SHA256 / MagicToken
      description: |
        Token HTTP Bearer autenticado:
        - **Personal Interno (`ADMIN`, `SALES_REP`):** Token firmado con HMAC-SHA256 emitido en `POST /api/v1/auth/login`.
        - **Clientes (`CUSTOMER_CONTACT`):** Token criptográfico de Enlace Mágico (32 bytes hex) validado contra su hash SHA-256 en `/api/v1/portal/*`.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Identificador único del recurso
      schema:
        type: string
    PublicToken:
      name: token
      in: path
      required: true
      description: Token público criptográfico de la cotización
      schema:
        type: string

  responses:
    BadRequest:
      description: Error de validación en los parámetros o cuerpo de la petición (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autenticado — Token Bearer ausente, inválido, revocado o expirado (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Acceso denegado — El rol actual no posee permisos para este recurso o intenta consultar datos de otro asesor/cliente (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado o inactivo (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de estado, colisión de concurrencia optimista o revisión superada (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Regla de negocio infringida (p. ej. margen bajo el piso duro o motivo de pérdida no válido) (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MarginProblemDetails'
    TooManyRequests:
      description: Límite de tasa excedido (Rate Limiting) (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error interno del servidor sin exposición de trazas sensibles (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProblemDetails:
      description: Error estándar RFC 7807 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ==========================================
    # ERROR & PROBLEM DETAILS SCHEMAS
    # ==========================================
    ErrorResponse:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          example: https://tools.ietf.org/html/rfc7807
        title:
          type: string
          example: Acceso denegado
        status:
          type: integer
          example: 403
        detail:
          type: string
          example: No tiene autorización para consultar recursos de otro asesor comercial.
        instance:
          type: string
        requestId:
          type: string

    MarginProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code:
              type: string
              example: MARGIN_BELOW_MINIMUM
            marginPct:
              type: number
              example: 15.4
            minMarginPct:
              type: number
              example: 25.0
            hardMinMarginPct:
              type: number
              example: 18.0
            shortfall:
              type: integer
              description: Monto faltante en CLP (entero) para alcanzar el margen requerido
              example: 450000

    # ==========================================
    # AUTH & USER SCHEMAS
    # ==========================================
    UserRole:
      type: string
      enum: [ADMIN, SALES_REP, CUSTOMER_CONTACT]

    User:
      type: object
      required: [id, email, name, role, phone]
      properties:
        id:
          type: string
          example: usr-admin-01
        email:
          type: string
          format: email
          example: admin@mlingenieria.cl
        name:
          type: string
          example: Victoria Villegas
        role:
          $ref: '#/components/schemas/UserRole'
        phone:
          type: string
          example: '+56 9 8234 5678'
        active:
          type: boolean
          example: true
        customerId:
          type: string
        contactId:
          type: string
        permissions:
          type: array
          items:
            type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@mlingenieria.cl
        password:
          type: string
          format: password
          example: admin123

    MagicLoginRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 10
          description: Token criptográfico de enlace mágico enviado al contacto del cliente

    AuthResponse:
      type: object
      required: [user, token, role, redirectTo]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Token Bearer para autenticar peticiones subsecuentes
        role:
          $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          items:
            type: string
        redirectTo:
          type: string
          example: /app/dashboard

    UserCreateRequest:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 2
        role:
          type: string
          enum: [ADMIN, SALES_REP]
        phone:
          type: string
          default: '+56 9 0000 0000'
        password:
          type: string
          minLength: 6

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        role:
          type: string
          enum: [ADMIN, SALES_REP]
        phone:
          type: string
        active:
          type: boolean

    # ==========================================
    # COMPANY SETTINGS SCHEMAS
    # ==========================================
    CompanySettings:
      type: object
      required:
        - id
        - name
        - legalName
        - rut
        - address
        - phone
        - email
        - currency
        - taxRatePct
        - minMarginPct
      properties:
        id:
          type: string
          example: comp-01
        name:
          type: string
          example: M&L Ingeniería Naval SpA
        legalName:
          type: string
          example: M&L Ingeniería y Servicios Navales SpA
        rut:
          type: string
          example: 76.543.210-K
        address:
          type: string
          example: Av. Angelmó 1850, Of. 402, Puerto Montt, Chile
        phone:
          type: string
          example: '+56 65 225 8900'
        email:
          type: string
          format: email
          example: contacto@mlingenieria.cl
        currency:
          type: string
          enum: [CLP]
          default: CLP
        taxRatePct:
          type: number
          description: Tasa de IVA vigente en Chile (19%)
          example: 19
        minMarginPct:
          type: number
          description: Margen mínimo corporativo exigido sobre precio de venta (%)
          example: 25
        hardMinMarginPct:
          type: number
          description: Piso duro no negociable de margen comercial (%)
          example: 18
        ufRate:
          type: number
          description: Valor referencial del día de la Unidad de Fomento (UF) en CLP
          example: 38500
        ufRateUpdatedAt:
          type: string
          format: date-time
        defaultPresentationText:
          type: string
        defaultTerms:
          type: string
        sessionTimeoutMinutes:
          type: integer
          example: 60
        lossReasons:
          type: array
          items:
            type: string
          example: [precio, plazo, competencia, proyecto aplazado, otro]
        pipelineProbabilities:
          type: object
          additionalProperties:
            type: number
          example:
            DRAFT: 10
            SENT: 40
            VIEWED: 60
            CHANGES_REQUESTED: 50

    CompanyUpdateRequest:
      type: object
      properties:
        minMarginPct:
          type: number
          minimum: 0
          maximum: 90
        hardMinMarginPct:
          type: number
          minimum: 0
          maximum: 90
        ufRate:
          type: number
          minimum: 1
        legalName:
          type: string
        rut:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        defaultTerms:
          type: string
        defaultPresentationText:
          type: string
        sessionTimeoutMinutes:
          type: integer
          minimum: 1
        lossReasons:
          type: array
          items:
            type: string
        pipelineProbabilities:
          type: object
          additionalProperties:
            type: number

    # ==========================================
    # CUSTOMERS & CONTACTS SCHEMAS
    # ==========================================
    Customer:
      type: object
      required: [id, businessName, taxId, address, salesRepId, active, createdAt]
      properties:
        id:
          type: string
          example: cust-01
        businessName:
          type: string
          example: Austral Salmón & Mar SpA
        taxId:
          type: string
          description: RUT chileno de la empresa cliente
          example: 76.112.890-4
        address:
          type: string
          example: Camino Chinquihue Km 12, Puerto Montt
        salesRepId:
          type: string
          example: usr-sales-01
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time

    CustomerCreateRequest:
      type: object
      required: [businessName, taxId, address]
      properties:
        businessName:
          type: string
          minLength: 2
        taxId:
          type: string
          minLength: 6
        address:
          type: string
          minLength: 2
        salesRepId:
          type: string

    CustomerUpdateRequest:
      type: object
      properties:
        businessName:
          type: string
          minLength: 2
        taxId:
          type: string
          minLength: 6
        address:
          type: string
          minLength: 2
        salesRepId:
          type: string
        active:
          type: boolean

    Contact:
      type: object
      required: [id, customerId, name, position, email, phone, active, createdAt]
      properties:
        id:
          type: string
          example: cont-01
        customerId:
          type: string
          example: cust-01
        name:
          type: string
          example: Ing. Matías Barrientos
        position:
          type: string
          example: Jefe de Flota y Mantenimiento Naval
        email:
          type: string
          format: email
          example: mbarrientos@australsalmon.cl
        phone:
          type: string
          example: '+56 9 9123 4567'
        active:
          type: boolean
          example: true
        portalTokenExpiresAt:
          type: string
          format: date-time
        portalTokenRevoked:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ContactCreateRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 2
        position:
          type: string
          default: Contacto
        email:
          type: string
          format: email
        phone:
          type: string
          default: '+56 9 0000 0000'

    ContactUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        position:
          type: string
        email:
          type: string
          format: email
