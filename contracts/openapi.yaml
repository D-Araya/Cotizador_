  # ==========================================
  # 8. INVOICES & PAYMENTS (POST-ACCEPTANCE CLP)
  # ==========================================
  /invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: Lista documentos de cobro (DC-XXXXXX) en CLP con cálculo automático de saldos y vencimientos
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` (`bearerAuth`).
        - **`ADMIN`:** Visualiza todos los documentos de cobro emitidos.
        - **`SALES_REP`:** Solo visualiza los documentos vinculados a sus propias cotizaciones.
        - Recalcula en tiempo real los estados (`PENDING`, `PARTIAL`, `PAID`, `OVERDUE`) según los pagos registrados y `dueDate`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - name: q
          in: query
          description: Búsqueda por N.º de documento, N.º de cotización o razón social
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista de documentos de cobro o envoltorio paginado
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  - $ref: '#/components/schemas/PaginatedInvoices'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Invoices]
      operationId: createInvoice
      summary: Emite un Documento de Cobro (DC-XXXXXX) a partir de una cotización aceptada
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario de la cotización (`bearerAuth`).
        Exige que la cotización esté en estado `ACCEPTED` y que no tenga un documento de cobro previo (`409 Conflict`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quotationId]
              properties:
                quotationId:
                  type: string
                paymentTerms:
                  type: string
                  example: 50% anticipo, 50% contra entrega
                dueDate:
                  type: string
                  format: date
      responses:
        '201':
          description: Documento de cobro creado con cronograma de hitos en CLP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invoices/{id}:
    get:
      tags: [Invoices]
      operationId: getInvoiceById
      summary: Obtiene el detalle de un Documento de Cobro con sus ítems, hitos y abonos
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Detalle del documento de cobro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Invoices]
      operationId: updateInvoice
      summary: Actualiza el estado, condiciones de pago o fecha de vencimiento de un Documento de Cobro
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/InvoiceStatus'
                paymentTerms:
                  type: string
                dueDate:
                  type: string
                  format: date
                paidAt:
                  type: string
                  format: date-time
                paymentMethod:
                  type: string
      responses:
        '200':
          description: Documento de cobro actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invoices/{id}/payments:
    post:
      tags: [Invoices]
      operationId: recordInvoicePayment
      summary: Registra un abono o pago total en CLP y recalcula hitos y estado del documento
      description: |
        **Rol requerido:** `ADMIN` o `SALES_REP` propietario (`bearerAuth`).
        Actualiza `paidAmount`, `balance`, el estado de cada hito en `paymentSchedule` y el estado global del documento (`PENDING`, `PARTIAL`, `PAID`, `OVERDUE`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
      responses:
        '201':
          description: Pago registrado y estado de documento recalculado
          content:
            application/json:
              schema:
                type: object
                required: [success, invoice, payment]
                properties:
                  success:
                    type: boolean
                  invoice:
                    $ref: '#/components/schemas/Invoice'
                  payment:
                    $ref: '#/components/schemas/InvoicePaymentRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

