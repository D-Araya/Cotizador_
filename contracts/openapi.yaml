        title: { type: string }
        currency: { type: string, default: CLP }
        presentationText: { type: string }
        notes: { type: string }
        internalNotes: { type: string }
        terms: { type: string }
        validityDays: { type: integer, default: 15 }
        discountPct: { type: number, minimum: 0, maximum: 99.99 }

    QuotationSettingsUpdateRequest:
      type: object
      properties:
        presentationText: { type: string }
        notes: { type: string }
        internalNotes: { type: string }
        terms: { type: string }
        validityDays: { type: integer, minimum: 1 }
        title: { type: string }
        currency: { type: string }
        discountPct: { type: number, minimum: 0, maximum: 99.99 }
        expectedUpdatedAt: { type: string }
        expectedStatus: { type: string }

