        dueDate:
          type: string
          format: date
          example: '2026-10-01'
        netSubtotal:
          type: integer
          description: Subtotal neto afecto a IVA en CLP (entero sin decimales)
          example: 2850000
        subtotal:
          type: integer
          description: Subtotal neto afecto a IVA en CLP (entero sin decimales)
          example: 2850000
        taxRatePct:
          type: number
          description: Tasa de IVA (19%)
          example: 19
        taxAmount:
          type: integer
          description: IVA (19%) en CLP (entero sin decimales)
