    # ==========================================
    # QUOTATION SCHEMAS (CLP & IVA 19%)
    # ==========================================
    QuotationStatus:
      type: string
      enum:
        - DRAFT
        - PENDING_APPROVAL
        - SENT
        - VIEWED
        - ACCEPTED
        - REJECTED
        - EXPIRED
        - CHANGES_REQUESTED

    QuotationLine:
      type: object
      required:
        - id
        - type
        - name
        - unit
        - cost
        - price
        - marginPct
        - quantity
        - subtotal
        - costTotal
      properties:
        id:
          type: string
        catalogItemId:
          type: string
        type:
          type: string
          enum: [PRODUCT, SERVICE]
        skuOrCode:
          type: string
        name:
          type: string
        unit:
          type: string
        cost:
          type: integer
          description: Costo unitario neto en CLP (entero sin decimales, uso interno exclusivo)
          example: 1850000
        originalUnitPrice:
          type: integer
          description: Precio unitario antes de descuento en CLP
          example: 2850000
        price:
          type: integer
          description: Precio unitario neto de venta en CLP (entero sin decimales)
          example: 2850000
        discountPct:
          type: number
          example: 0
        discountAmount:
          type: integer
          example: 0
        marginPct:
          type: number
          description: Margen comercial sobre precio de venta (%)
          example: 35.09
        quantity:
          type: number
          example: 1
        subtotal:
          type: integer
          description: Subtotal neto de la línea en CLP (entero sin decimales)
          example: 2850000
        costTotal:
          type: integer
          description: Costo total de la línea en CLP (entero sin decimales)
          example: 1850000

    ExtraCostLine:
      type: object
      required: [id, type, name, unit, cost, price, quantity, subtotal]
      properties:
        id: { type: string }
        catalogItemId: { type: string }
        type: { type: string, enum: [PRODUCT, SERVICE], default: SERVICE }
        name: { type: string, example: Movilización e Inspección en Puerto Chacabuco }
        unit: { type: string, default: GLOBAL }
        cost: { type: integer, example: 250000 }
        price: { type: integer, example: 250000 }
        quantity: { type: number, example: 1 }
        subtotal: { type: integer, example: 250000 }
        notes: { type: string }

    QuotationAttachment:
      type: object
      required: [id, name, url, addedAt]
      properties:
        id: { type: string }
        name: { type: string, example: Plano General Disposición General.pdf }
        url: { type: string, example: https://mlingenieria.cl/docs/plano-dg.pdf }
        description: { type: string }
        addedAt: { type: string, format: date-time }
        addedBy: { type: string }
        addedByName: { type: string }

    StatusHistoryEntry:
      type: object
      required: [id, toStatus, actor, actorRole, comment, timestamp]
      properties:
        id: { type: string }
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/QuotationStatus'
            - type: 'null'
        toStatus:
          $ref: '#/components/schemas/QuotationStatus'
        actor: { type: string }
        actorRole: { type: string, enum: [ADMIN, SALES_REP, CUSTOMER_CONTACT, SYSTEM] }
        comment: { type: string }
        timestamp: { type: string, format: date-time }

    Quotation:
      type: object
      required:
        - id
        - quotationNumber
        - customerId
        - contactId
        - salesRepId
        - status
        - createdAt
        - updatedAt
        - validityDays
        - publicToken
        - minMarginPctApplied
        - lines
        - extraCosts
        - statusHistory
        - totalCost
        - totalSale
        - profit
        - marginPct
        - subtotal
        - taxAmount
        - grandTotal
        - extraCostsTotal
      properties:
        id:
          type: string
          example: quot-001
        quotationNumber:
          type: string
          example: COT-000259
        quotationGroupId:
          type: string
        revision:
          type: integer
          example: 1
        isLatestRevision:
          type: boolean
          example: true
        supersededByQuotationId:
          type: string
        rootQuotationNumber:
          type: string
        customerId:
          type: string
        customerBusinessName:
          type: string
        contactId:
          type: string
        salesRepId:
          type: string
        salesRepName:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/QuotationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        validityDays:
          type: integer
          example: 15
        validUntil:
          type: string
          format: date-time
        currency:
          type: string
          enum: [CLP]
          default: CLP
        taxRatePct:
          type: number
          description: IVA chileno aplicado (19%)
          example: 19
        publicToken:
          type: string
        minMarginPctApplied:
          type: number
          example: 25
        presentationText:
          type: string
        notes:
          type: string
        internalNotes:
          type: string
          description: Notas internas confidenciales (nunca expuestas al cliente)
        terms:
          type: string
        termsAccepted:
          type: boolean
        acceptedAt:
          type: string
          format: date-time
        rejectedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
        lossReason:
          type: string
        nextActionAt:
          type: string
          format: date-time
        nextActionNote:
          type: string
        firstViewedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuotationLine'
        extraCosts:
          type: array
          items:
            $ref: '#/components/schemas/ExtraCostLine'
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/StatusHistoryEntry'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/QuotationAttachment'
        discountPct:
          type: number
        discountAmount:
          type: integer
          description: Monto de descuento global en CLP (entero)
        totalSavings:
          type: integer
          description: Ahorro total acumulado en CLP (entero)
        grossSubtotal:
          type: integer
          description: Subtotal bruto antes de descuentos en CLP (entero)
        totalCost:
          type: integer
          description: Costo total neto en CLP (entero sin decimales)
          example: 1850000
        totalSale:
          type: integer
          description: Venta neta total en CLP (entero sin decimales)
          example: 2850000
        profit:
          type: integer
          description: Utilidad neta en CLP (totalSale - totalCost, entero sin decimales)
          example: 1000000
        marginPct:
          type: number
          description: Margen comercial global sobre venta (%)
          example: 35.09
        subtotal:
          type: integer
          description: Subtotal neto afecto a IVA en CLP (entero sin decimales)
          example: 2850000
        netSubtotal:
          type: integer
          description: Subtotal neto afecto a IVA en CLP (entero sin decimales)
          example: 2850000
        taxAmount:
          type: integer
          description: Monto de IVA (19%) redondeado a entero en CLP
          example: 541500
        total:
          type: integer
          description: Total general bruto con IVA (19%) en CLP (entero sin decimales)
          example: 3391500
        grandTotal:
          type: integer
          description: Total general bruto con IVA (19%) en CLP (entero sin decimales)
          example: 3391500
        extraCostsTotal:
          type: integer
          description: Suma informativa de costos adicionales en CLP
          example: 0
        ufRate:
          type: number
          example: 38500
        ufNetSubtotal:
          type: number
          example: 74.03
        ufGrandTotal:
          type: number
          example: 88.09
        clientSignerName:
          type: string
        clientSignerPosition:
          type: string
        acceptanceHash:
          type: string
        acceptedOffline:
          type: boolean
        offlinePurchaseOrderNumber:
          type: string
        offlineAcceptedBy:
          type: string
        offlineNote:
          type: string
        marginException:
          type: boolean
        marginExceptionReason:
          type: string
        marginApprovalStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED, NONE]
        marginApprovedBy:
          type: string
        marginApprovedByName:
          type: string
        marginApprovedAt:
          type: string
          format: date-time
        marginApprovalComment:
          type: string

    PublicQuotationDTO:
      type: object
