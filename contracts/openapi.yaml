          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Customers]
      operationId: deactivateCustomer
      summary: Baja lógica de un cliente corporativo (Exclusivo ADMIN)
      description: |
        **Rol requerido:** Exclusivo `ADMIN` (`bearerAuth`). Marca `deletedAt` y `active: false`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Cliente dado de baja lógicamente
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
