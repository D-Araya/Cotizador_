<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cotizador Online</title>
    <meta name="description" content="Sistema integral de gestión de cotizaciones para ingeniería y proyectos en Chile, con portal de clientes, control de margen comercial y asistente IA." />
    <meta property="og:title" content="Cotizador Online" />
    <meta property="og:description" content="Sistema integral de gestión de cotizaciones para ingeniería y proyectos en Chile, con portal de clientes, control de margen comercial y asistente IA." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      (function() {
        // 1. Suprimir excepciones externas generadas por extensiones de Chrome (p. ej. Urban VPN eppiocemhmnlbhjplcgkofciiegomcon)
        try {
          window.addEventListener('error', function(event) {
            var src = (event && (event.filename || (event.error && event.error.stack))) || '';
            var msg = (event && (event.message || '')) || '';
            if (src.indexOf('chrome-extension://') !== -1 || msg.indexOf('Cannot set property fetch') !== -1) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = (event && (event.reason && (event.reason.stack || event.reason.message))) || '';
            if (typeof reason === 'string' && (reason.indexOf('chrome-extension://') !== -1 || reason.indexOf('Cannot set property fetch') !== -1)) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          }, true);
        } catch (e) {}

        // 2. Habilitar setter seguro para window.fetch y Window.prototype.fetch
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _currentFetch || _origFetch;
                },
                set: function(val) {
                  _currentFetch = val;
                  try {
                    Object.defineProperty(this, 'fetch', {
                      value: val,
                      writable: true,
                      configurable: true,
                      enumerable: true
                    });
                  } catch (e) {}
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }

          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _currentFetch || _origFetch;
              },
              set: function(val) {
                _currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('cotizador_theme_mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
